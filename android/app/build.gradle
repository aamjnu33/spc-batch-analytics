plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aamjnu33.spcbatch'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aamjnu33.spcbatch'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Personal sideload build: a fixed, committed debug key so each new APK
    // installs over the previous one instead of requiring an uninstall.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
