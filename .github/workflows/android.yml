name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk SPC-Batch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SPC-Batch-apk
          path: android/SPC-Batch.apk

      # Stable download link for the phone: Releases → "Android app (latest)".
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          body: Personal sideload build of the SPC Batch dashboard. Download SPC-Batch.apk on your phone and open it to install.
          prerelease: true
          files: android/SPC-Batch.apk
